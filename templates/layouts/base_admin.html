{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}{% endblock %} - Gestion école</title>
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
<div class="app">

  <!-- Menu latéral -->
  <aside class="sidebar">
    <div class="brand">School<span>Manager</span></div>
    <nav class="nav">
      <a href="{% url "dashboard" %}" class="{% if pages == 'admin' %}active{% endif %}">Tableau de bord</a>
      <a href="{% url "school_year" %}" class="{% if pages == 'school_year' %}active{% endif %}" >Année scolaire</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>{% block titre_page %}{% endblock %}</h1>
        <p>{% block desc %}{% endblock %}</p>
      </div>
      <div class="btn-group">
        {% block btn %}{% endblock %}
      </div>
    </header>

    {% block content %}
    
    {% endblock  %}
  </main>
</div>
</body>
</html>
